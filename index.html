<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Think Mart</title>
  <link rel="stylesheet" href="styles/style.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-shell">
      <section class="auth-visual">
        <a class="brand" href="Home-Page.html">
          <span class="brand-mark">TM</span>
          Think Mart
        </a>
        <div>
          <h1>Shop smarter. Live better.</h1>
          <p>Sign in to access deals on laptops, mobiles, watches, and more — curated for everyday life.</p>
        </div>
        <p style="opacity:0.7;font-size:0.9rem;">Trusted by 25,000+ shoppers across India</p>
      </section>

      <section class="auth-form-wrap">
        <h2>Welcome back</h2>
        <p class="sub">Log in to continue shopping at Think Mart.</p>

        <form action="Home-Page.html" method="get">
          <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required />
          </div>

          <div class="form-row">
            <label><input type="checkbox" /> Remember me</label>
            <a href="#">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>

        <p class="auth-switch">
          New to Think Mart?
          <a href="Register-Page.html">Create an account</a>
        </p>
      </section>
    </div>
  </main>
</body>
</html>
